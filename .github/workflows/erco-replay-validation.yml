name: Validate retained ERCO scheduling and monitoring

on:
  push:
    branches: [main]
    paths: ['.github/erco-validation/2026-10-13.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - name: Install locked environment
        run: uv sync --frozen
      - name: Restore exact retained observation history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/ERCO
            data/interim/ERCO
          key: refresh-v1-Linux-ERCO-38349279499-1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: retrain-candidate-ERCO-38349279499-1
          run-id: 38349279499
          github-token: ${{ github.token }}
          path: .tools/erco-candidate
      - name: Score scheduling with unchanged source provenance
        env:
          CARBON_MODELS_DIR: .tools/erco-candidate/candidates/ERCO/38349279499-1/demo/models
        run: |
          mkdir -p reports
          cp .tools/erco-candidate/reports/backtest_ERCO_* reports/
          uv run --frozen carbon-scheduler schedule-backtest --region ERCO
      - name: Compare retained CQR forecasts against seasonal naive
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from carbon_scheduler.config import get_settings
          from carbon_scheduler.models.reporting import run_backtest
          from carbon_scheduler.models.evaluate import compare_point_forecasts, coverage_verdict, summarize
          results = {}
          for target in ('demand_mwh', 'carbon_intensity_g_per_kwh'):
              stem = Path('reports') / f'backtest_ERCO_{target}_cqr'
              info = json.loads(stem.with_suffix('.json').read_text())
              path = run_backtest('ERCO', target, 'naive', get_settings(),
                                  test_start=pd.Timestamp(info['test_start']),
                                  test_end=pd.Timestamp(info['test_end']))
              naive = pd.read_parquet(path.with_suffix('.parquet'))
              candidate = pd.read_parquet(stem.with_suffix('.parquet'))
              comparison = compare_point_forecasts(naive, candidate).rename(columns={'mae_lgbm': 'mae_cqr_median'})
              results[target] = {'paired': comparison.to_dict(orient='index'),
                                 'g4_pass': coverage_verdict(summarize(candidate))}
          Path('reports/ERCO-baseline-comparison.json').write_text(json.dumps(results, indent=2, allow_nan=False))
          PY
      - name: Record current candidate monitor diagnostics
        env:
          CARBON_MODELS_DIR: .tools/erco-candidate/candidates/ERCO/38349279499-1/demo/models
        run: |
          set +e
          uv run --frozen carbon-scheduler monitor --region ERCO
          status=$?
          set -e
          echo "$status" > reports/monitor-exit-code.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          echo "Monitor exit $status recorded; alert exit 2 is a diagnostic, not a healthy acceptance pass."
      - name: Retain diagnostic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ERCO-replay-monitor-validation
          path: |
            reports/schedule_backtest_ERCO.*
            reports/monitor*
            reports/ERCO-baseline-comparison.json
            reports/backtest_ERCO_*_naive.*
          if-no-files-found: error
          retention-days: 30

