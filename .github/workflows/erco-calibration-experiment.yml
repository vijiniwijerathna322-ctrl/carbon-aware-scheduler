name: ERCO exploratory calibration comparison
on:
  push:
    branches: [main]
    paths: ['.github/erco-validation/calibration-experiment.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - run: uv sync --frozen
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/raw/ERCO
            data/interim/ERCO
          key: refresh-v1-Linux-ERCO-38349279499-1
          fail-on-cache-miss: true
      - run: uv run --frozen python scripts/experiment_erco_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: ERCO-exploratory-calibration
          path: reports/erco-calibration-experiment/
          if-no-files-found: error
          retention-days: 30
