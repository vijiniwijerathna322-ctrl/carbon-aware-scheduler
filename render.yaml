services:
  - type: web
    name: carbon-scheduler-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: CARBON_DATA_DIR
        value: demo/data
      - key: CARBON_MODELS_DIR
        value: demo/models
      - key: API_KEYS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
